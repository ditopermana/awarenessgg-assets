<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Oh God, Everything is so fucked.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0E13"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#2A2D3D" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
    <clipPath id="type">
      <rect x="70" y="0" width="0" height="240">
        <animate attributeName="width" dur="7s" repeatCount="indefinite"
                 values="0;0;760;760;760;0"
                 keyTimes="0;0.04;0.45;0.88;0.96;1"
                 calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>
  <rect width="900" height="240" rx="14" fill="url(#glow)">
    <animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- top label -->
  <text x="70" y="62" font-family="'Courier New', monospace" font-size="15" fill="#C9FF52" letter-spacing="3">
    // AWARENESSGG-ASSETS
    <animate attributeName="opacity" values="1;1;.3;1;1;.5;1" keyTimes="0;.5;.52;.54;.8;.82;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- main text, typing reveal -->
  <g clip-path="url(#type)">
    <!-- glitch layer: cyan -->
    <text x="70" y="136" font-family="'Courier New', monospace" font-size="36" font-weight="700"
          fill="#00F0FF" textLength="760" lengthAdjust="spacingAndGlyphs" opacity=".75">
      Oh God, Everything is so fucked.
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;0 0;-5 1;4 -2;0 0;0 0;-3 0;0 0"
                        keyTimes="0;.55;.57;.59;.61;.8;.82;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- glitch layer: magenta -->
    <text x="70" y="136" font-family="'Courier New', monospace" font-size="36" font-weight="700"
          fill="#FF2E88" textLength="760" lengthAdjust="spacingAndGlyphs" opacity=".75">
      Oh God, Everything is so fucked.
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;0 0;5 -1;-4 2;0 0;0 0;3 0;0 0"
                        keyTimes="0;.55;.57;.59;.61;.8;.82;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- main layer -->
    <text x="70" y="136" font-family="'Courier New', monospace" font-size="36" font-weight="700"
          fill="#ECEDF4" textLength="760" lengthAdjust="spacingAndGlyphs">
      Oh God, Everything is so fucked.
      <animate attributeName="fill" values="#ECEDF4;#ECEDF4;#C9FF52;#ECEDF4;#ECEDF4" keyTimes="0;.55;.58;.61;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- cursor follows the typing -->
  <rect y="100" width="14" height="44" fill="#C9FF52">
    <animate attributeName="x" dur="7s" repeatCount="indefinite"
             values="70;70;830;830;830;70" keyTimes="0;0.04;0.45;0.88;0.96;1"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="70" y="188" font-family="'Courier New', monospace" font-size="14" fill="#8D90A0">
    assets, but make it chaos.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.55;.9;1" dur="7s" repeatCount="indefinite"/>
  </text>

  <!-- scanlines + moving scan bar -->
  <rect width="900" height="240" rx="14" fill="url(#scan)"/>
  <rect width="900" height="40" fill="#C9FF52" opacity=".05">
    <animate attributeName="y" values="-40;240" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- border -->
  <rect x="1" y="1" width="898" height="238" rx="14" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
