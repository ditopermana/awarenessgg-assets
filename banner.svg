<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Oh God, Everything is so fucked.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050102"/>
      <stop offset="0.6" stop-color="#14030a"/>
      <stop offset="1" stop-color="#2a0510"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff1e3c" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#ff1e3c" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ff1e3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.45" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#d00024"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ff9e00"/>
      <stop offset="1" stop-color="#e5001c"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1e3c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff1e3c" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="900" height="320" fill="url(#bg)"/>

    <!-- spotlights -->
    <g>
      <polygon points="200,0 110,320 300,320" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate" values="-10 200 0;10 200 0;-10 200 0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;1;.4" dur="2.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="560,0 470,320 650,320" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate" values="12 560 0;-12 560 0;12 560 0" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.35;1" dur="2.1s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- equalizer bars -->
    <g>
      <rect x="8"   y="240" width="56" height="80" fill="url(#eq)"><animate attributeName="y" values="240;200;260;220;240" dur="1.3s" repeatCount="indefinite"/><animate attributeName="height" values="80;120;60;100;80" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="83"  y="220" width="56" height="100" fill="url(#eq)"><animate attributeName="y" values="220;250;190;240;220" dur="1.1s" repeatCount="indefinite"/><animate attributeName="height" values="100;70;130;80;100" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="158" y="250" width="56" height="70" fill="url(#eq)"><animate attributeName="y" values="250;190;230;260;250" dur="1.5s" repeatCount="indefinite"/><animate attributeName="height" values="70;130;90;60;70" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="233" y="230" width="56" height="90" fill="url(#eq)"><animate attributeName="y" values="230;200;255;215;230" dur="1.2s" repeatCount="indefinite"/><animate attributeName="height" values="90;120;65;105;90" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="308" y="245" width="56" height="75" fill="url(#eq)"><animate attributeName="y" values="245;205;240;190;245" dur="1.4s" repeatCount="indefinite"/><animate attributeName="height" values="75;115;80;130;75" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="383" y="215" width="56" height="105" fill="url(#eq)"><animate attributeName="y" values="215;255;200;235;215" dur="1.0s" repeatCount="indefinite"/><animate attributeName="height" values="105;65;120;85;105" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="458" y="240" width="56" height="80" fill="url(#eq)"><animate attributeName="y" values="240;195;250;225;240" dur="1.6s" repeatCount="indefinite"/><animate attributeName="height" values="80;125;70;95;80" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="533" y="225" width="56" height="95" fill="url(#eq)"><animate attributeName="y" values="225;250;205;240;225" dur="1.15s" repeatCount="indefinite"/><animate attributeName="height" values="95;70;115;80;95" dur="1.15s" repeatCount="indefinite"/></rect>
      <rect x="608" y="250" width="56" height="70" fill="url(#eq)"><animate attributeName="y" values="250;210;240;195;250" dur="1.35s" repeatCount="indefinite"/><animate attributeName="height" values="70;110;80;125;70" dur="1.35s" repeatCount="indefinite"/></rect>
      <rect x="683" y="235" width="56" height="85" fill="url(#eq)"><animate attributeName="y" values="235;200;255;220;235" dur="1.25s" repeatCount="indefinite"/><animate attributeName="height" values="85;120;65;100;85" dur="1.25s" repeatCount="indefinite"/></rect>
      <rect x="758" y="220" width="56" height="100" fill="url(#eq)"><animate attributeName="y" values="220;255;195;235;220" dur="1.05s" repeatCount="indefinite"/><animate attributeName="height" values="100;65;125;85;100" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="833" y="245" width="56" height="75" fill="url(#eq)"><animate attributeName="y" values="245;200;240;215;245" dur="1.45s" repeatCount="indefinite"/><animate attributeName="height" values="75;120;80;105;75" dur="1.45s" repeatCount="indefinite"/></rect>
    </g>

    <!-- anime speed lines radiating from the performer -->
    <g stroke="#ff2e3a" stroke-width="2" opacity=".4" stroke-dasharray="40 70">
      <animate attributeName="stroke-dashoffset" values="0;-110" dur="0.7s" repeatCount="indefinite"/>
      <line x1="730" y1="150" x2="1100" y2="150"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(30 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(60 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(90 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(120 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(150 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(180 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(210 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(240 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(270 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(300 730 150)"/>
      <line x1="730" y1="150" x2="1100" y2="150" transform="rotate(330 730 150)"/>
    </g>

    <!-- aura + ring behind performer -->
    <circle cx="730" cy="150" r="150" fill="url(#aura)">
      <animate attributeName="r" values="140;165;140" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="150" r="92" fill="none" stroke="#ff2e3a" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="88;100;88" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;1;.6" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- performer: original anime-style rocker silhouette -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.6s" repeatCount="indefinite"/>
      <!-- legs -->
      <path d="M705,235 L692,312 L716,312 L730,252 L744,312 L768,312 L755,235 Z" fill="#0b0305" stroke="#ff2e3a" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- torso / jacket -->
      <path d="M700,150 L760,150 L774,242 L686,242 Z" fill="#0b0305" stroke="#ff2e3a" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M730,150 L730,242" stroke="#ff2e3a" stroke-width="1.5" opacity=".7"/>
      <!-- guitar -->
      <g transform="rotate(-20 730 205)">
        <ellipse cx="722" cy="208" rx="36" ry="25" fill="#1a0a0e" stroke="#ff2e3a" stroke-width="2"/>
        <ellipse cx="752" cy="200" rx="22" ry="17" fill="#1a0a0e" stroke="#ff2e3a" stroke-width="2"/>
        <rect x="762" y="196" width="100" height="8" fill="#0b0305" stroke="#ff2e3a" stroke-width="1.5"/>
        <rect x="860" y="190" width="24" height="20" rx="3" fill="#0b0305" stroke="#ff2e3a" stroke-width="1.5"/>
        <rect x="712" y="198" width="22" height="5" fill="#ff2e3a"/>
        <rect x="712" y="212" width="22" height="5" fill="#ff2e3a"/>
        <line x1="745" y1="200" x2="864" y2="200" stroke="#ffb703" stroke-width="1" opacity=".8"/>
      </g>
      <!-- arms -->
      <line x1="762" y1="158" x2="824" y2="171" stroke="#ff2e3a" stroke-width="15" stroke-linecap="round" opacity=".7"/>
      <line x1="762" y1="158" x2="824" y2="171" stroke="#0b0305" stroke-width="12" stroke-linecap="round"/>
      <line x1="698" y1="158" x2="722" y2="214" stroke="#ff2e3a" stroke-width="15" stroke-linecap="round" opacity=".7"/>
      <line x1="698" y1="158" x2="722" y2="214" stroke="#0b0305" stroke-width="12" stroke-linecap="round"/>
      <!-- head (headbang) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 730 150;-10 730 150;8 730 150;0 730 150" dur="1.2s" repeatCount="indefinite"/>
        <ellipse cx="730" cy="120" rx="24" ry="28" fill="#12060a" stroke="#ff2e3a" stroke-width="1.5"/>
        <polygon points="703,122 684,84 712,98 716,60 732,92 752,54 756,96 782,74 765,126 750,100 730,106 712,100" fill="#0b0305" stroke="#ff2e3a" stroke-width="1.5" stroke-linejoin="round"/>
        <polygon points="713,120 727,123 713,127" fill="#ff2e3a" filter="url(#glow)"><animate attributeName="opacity" values="1;.4;1" dur="0.9s" repeatCount="indefinite"/></polygon>
        <polygon points="733,123 747,120 747,127" fill="#ff2e3a" filter="url(#glow)"><animate attributeName="opacity" values="1;.4;1" dur="0.9s" repeatCount="indefinite"/></polygon>
      </g>
    </g>

    <!-- flames -->
    <g fill="url(#fire)" opacity=".92">
      <path d="M20,320 C-20,280 0,250 30,190 C30,260 65,255 55,225 C95,265 90,295 70,320 Z">
        <animate attributeName="d" dur="1.1s" repeatCount="indefinite" values="M20,320 C-20,280 0,250 30,190 C30,260 65,255 55,225 C95,265 90,295 70,320 Z;M20,320 C-20,280 0,250 30,160 C30,260 65,255 55,195 C95,265 90,295 70,320 Z;M20,320 C-20,280 0,250 30,205 C30,260 65,255 55,235 C95,265 90,295 70,320 Z;M20,320 C-20,280 0,250 30,190 C30,260 65,255 55,225 C95,265 90,295 70,320 Z"/>
      </path>
      <path d="M170,320 C130,280 150,250 180,190 C180,260 215,255 205,225 C245,265 240,295 220,320 Z">
        <animate attributeName="d" dur="0.9s" repeatCount="indefinite" values="M170,320 C130,280 150,250 180,170 C180,260 215,255 205,205 C245,265 240,295 220,320 Z;M170,320 C130,280 150,250 180,205 C180,260 215,255 205,235 C245,265 240,295 220,320 Z;M170,320 C130,280 150,250 180,160 C180,260 215,255 205,195 C245,265 240,295 220,320 Z;M170,320 C130,280 150,250 180,170 C180,260 215,255 205,205 C245,265 240,295 220,320 Z"/>
      </path>
      <path d="M330,320 C290,280 310,250 340,190 C340,260 375,255 365,225 C405,265 400,295 380,320 Z">
        <animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M330,320 C290,280 310,250 340,205 C340,260 375,255 365,235 C405,265 400,295 380,320 Z;M330,320 C290,280 310,250 340,160 C340,260 375,255 365,195 C405,265 400,295 380,320 Z;M330,320 C290,280 310,250 340,185 C340,260 375,255 365,220 C405,265 400,295 380,320 Z;M330,320 C290,280 310,250 340,205 C340,260 375,255 365,235 C405,265 400,295 380,320 Z"/>
      </path>
      <path d="M490,320 C450,280 470,250 500,190 C500,260 535,255 525,225 C565,265 560,295 540,320 Z">
        <animate attributeName="d" dur="1.0s" repeatCount="indefinite" values="M490,320 C450,280 470,250 500,165 C500,260 535,255 525,200 C565,265 560,295 540,320 Z;M490,320 C450,280 470,250 500,200 C500,260 535,255 525,232 C565,265 560,295 540,320 Z;M490,320 C450,280 470,250 500,175 C500,260 535,255 525,210 C565,265 560,295 540,320 Z;M490,320 C450,280 470,250 500,165 C500,260 535,255 525,200 C565,265 560,295 540,320 Z"/>
      </path>
      <path d="M620,320 C580,280 600,250 630,190 C630,260 665,255 655,225 C695,265 690,295 670,320 Z">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M620,320 C580,280 600,250 630,200 C630,260 665,255 655,230 C695,265 690,295 670,320 Z;M620,320 C580,280 600,250 630,165 C630,260 665,255 655,200 C695,265 690,295 670,320 Z;M620,320 C580,280 600,250 630,185 C630,260 665,255 655,220 C695,265 690,295 670,320 Z;M620,320 C580,280 600,250 630,200 C630,260 665,255 655,230 C695,265 690,295 670,320 Z"/>
      </path>
      <path d="M780,320 C740,280 760,250 790,190 C790,260 825,255 815,225 C855,265 850,295 830,320 Z">
        <animate attributeName="d" dur="0.95s" repeatCount="indefinite" values="M780,320 C740,280 760,250 790,170 C790,260 825,255 815,205 C855,265 850,295 830,320 Z;M780,320 C740,280 760,250 790,205 C790,260 825,255 815,235 C855,265 850,295 830,320 Z;M780,320 C740,280 760,250 790,160 C790,260 825,255 815,195 C855,265 850,295 830,320 Z;M780,320 C740,280 760,250 790,170 C790,260 825,255 815,205 C855,265 850,295 830,320 Z"/>
      </path>
    </g>

    <!-- embers -->
    <g fill="#ffb703">
      <circle cx="60"  cy="320" r="2"><animate attributeName="cy" values="320;40" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="320" r="1.6"><animate attributeName="cy" values="320;60" dur="4.1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="320" r="2.2"><animate attributeName="cy" values="320;30" dur="3.8s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="320" r="1.8"><animate attributeName="cy" values="320;50" dur="4.4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="4.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="320" r="2"><animate attributeName="cy" values="320;40" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="320" r="1.5"><animate attributeName="cy" values="320;70" dur="4.0s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="4.0s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="320" r="2.1"><animate attributeName="cy" values="320;35" dur="3.3s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3.3s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="320" r="1.7"><animate attributeName="cy" values="320;45" dur="4.2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- tour label -->
    <text x="50" y="40" font-family="'Courier New', monospace" font-size="13" letter-spacing="4" fill="#ff2e3a" font-weight="700">
      ★ AWARENESSGG-ASSETS ★ LIVE &amp; LOUD ★
      <animate attributeName="opacity" values="1;1;.35;1;1;.6;1" keyTimes="0;.5;.52;.54;.8;.82;1" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- headline: slam-in text -->
    <g font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif" font-weight="900">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-120 0;0 0;0 0;0 0;60 0" keyTimes="0;.06;.85;.93;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.06;.85;.93;1" dur="8s" repeatCount="indefinite"/>
        <text x="50" y="100" font-size="56" textLength="215" lengthAdjust="spacingAndGlyphs" fill="#ECEDF4" stroke="#000" stroke-width="3" paint-order="stroke">OH GOD,</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="-120 0;0 0;0 0;0 0;60 0" keyTimes="0;.06;.85;.93;1" dur="8s" begin="0.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.06;.85;.93;1" dur="8s" begin="0.25s" repeatCount="indefinite"/>
        <text x="50" y="162" font-size="56" textLength="400" lengthAdjust="spacingAndGlyphs" fill="#ECEDF4" stroke="#000" stroke-width="3" paint-order="stroke">EVERYTHING IS</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="-140 0;0 0;0 0;0 0;60 0" keyTimes="0;.07;.85;.93;1" dur="8s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.07;.85;.93;1" dur="8s" begin="0.5s" repeatCount="indefinite"/>
        <g filter="url(#glow)">
          <text x="50" y="252" font-size="94" textLength="440" lengthAdjust="spacingAndGlyphs" fill="url(#hot)" stroke="#000" stroke-width="4" paint-order="stroke">SO FUCKED.
            <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 2;4 -2;-3 1;0 0;0 0" keyTimes="0;.5;.53;.56;.59;.62;1" dur="2.5s" repeatCount="indefinite"/>
          </text>
        </g>
      </g>
    </g>

    <!-- lightning + screen flash -->
    <path d="M610,0 L578,92 L612,92 L572,196 L652,72 L616,72 L642,0 Z" fill="#fff" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;0;.8;0;0" keyTimes="0;.6;.61;.63;.65;.68;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <rect width="900" height="320" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;0;.22;0;.12;0;0" keyTimes="0;.6;.61;.63;.65;.68;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- scan bar -->
    <rect width="900" height="36" fill="#ff2e3a" opacity=".05">
      <animate attributeName="y" values="-36;320" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- border -->
  <rect x="1.5" y="1.5" width="897" height="317" rx="14" fill="none" stroke="#ff2e3a" stroke-width="2.5" stroke-dasharray="14 8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
